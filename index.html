<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, Vibecoding!</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-accent: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, var(--bg-accent), var(--bg));
      color: var(--text);
    }

    .card {
      max-width: 560px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0 0 12px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 8px;
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">✨</div>
    <span class="badge">Vibecoding</span>
    <h1>Hello, World!</h1>
    <p>Dit pagina&#39;tje is gebouwd door samen met een AI te "vibecoden":</p>
    <p>gewoon vertellen wat je wilt, en de code laten ontstaan.</p>
    <footer>Gemaakt als eerste stap richting een echte app.</footer>
  </main>
</body>
</html>
